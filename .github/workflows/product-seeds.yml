name: Product seeds

# Product seed paths are explicit: dry-run packaging steps are hard checks, while
# signing/notarization only runs on manual dispatch where secrets can be present.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/package-*.sh"
      - "scripts/publish-*.sh"
      - "scripts/cross-target-seed.sh"
      - "packaging/**"
      - ".github/workflows/product-seeds.yml"
      - "src/main.rs"

jobs:
  packaging-dry-run:
    name: Packaging dry-run hard gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/package-msi-seed.sh
      - run: bash scripts/package-notarize-seed.sh
      - run: bash scripts/publish-homebrew-tap-seed.sh
      - run: bash scripts/publish-winget-seed.sh

  cross-compile-seed:
    name: Cross-compile seed hard gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install clang + zig
        run: |
          sudo apt-get update
          sudo apt-get install -y clang xz-utils
          curl -sL https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz | sudo tar -xJ -C /opt
          echo "/opt/zig-linux-x86_64-0.13.0" >> "$GITHUB_PATH"
      - name: Build host mako
        run: cargo build --release
      - name: Cross-target seed script
        run: bash scripts/cross-target-seed.sh
      - name: Smoke --target list via mako help
        run: ./target/release/mako build --help | head -40

  release-signing-smoke:
    name: Release signing smoke (manual/secrets)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MSI dry-run
        run: bash scripts/package-msi-seed.sh
      - name: macOS notarize dry-run when APPLE_* secrets are present
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/package-notarize-seed.sh
      - name: Authenticode/notarize docs present
        run: test -f scripts/package-msi-notes.md && test -f scripts/package-macos-notarize-notes.md
